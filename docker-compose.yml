# nettest-portable - network test servers for Ubuntu 26.04 / Armbian 26.8
#
# One image, one container per server. All services use host networking:
# netperf data connections, iperf3 UDP tests, Crusader's UDP latency probes
# and Cutie's WebRTC data channel all use ports that cannot be listed ahead
# of time, so publishing individual ports would break them.
#
# On the board, this file is all you need:
#   docker compose pull && docker compose up -d
# To build the image locally instead (in a git checkout):
#   docker compose up -d --build
#
# See README.md for details.

# Fixed project name, so it doesn't depend on the name of this directory
name: nettest-portable

x-nettest: &nettest
  # The published Docker Hub image. Set NETTEST_IMAGE (in .env) to use
  # another one. "build:" is only used by "docker compose build" in a git
  # checkout; "docker compose pull" just downloads the image.
  image: ${NETTEST_IMAGE:-richbhanover1/nettest-portable:latest}
  build:
    context: .
    args:
      CUTIE_REF: main            # Cutie branch or tag to build
      CRUSADER_VERSION: v0.3.2   # Crusader release tag
  network_mode: host
  restart: unless-stopped
  init: false                    # tini is already the image's ENTRYPOINT
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  netperf:
    <<: *nettest
    container_name: nettest-netperf
    # -D: stay in the foreground (don't daemonize)
    command: ["netserver", "-D", "-p", "12865"]

  iperf:
    <<: *nettest
    container_name: nettest-iperf
    # iperf v2, TCP server on port 5001
    command: ["iperf", "-s", "-p", "5001"]

  iperf3:
    <<: *nettest
    container_name: nettest-iperf3
    # iperf3 server on port 5201 (handles both TCP and UDP tests)
    command: ["iperf3", "-s", "-p", "5201"]

  crusader:
    <<: *nettest
    container_name: nettest-crusader
    # TCP + UDP port 35481
    command: ["crusader", "serve", "--port", "35481"]

  cutie:
    <<: *nettest
    container_name: nettest-cutie
    working_dir: /opt/cutie
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4173"
      LOG_LEVEL: "3"
    command: ["node", "build"]

  about:
    <<: *nettest
    container_name: nettest-about
    # Port 80 is privileged: start as root with only the capabilities needed
    # to bind it and switch user; server.mjs drops to "nettest" right after bind.
    user: root
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    # Serves the ABOUT.md that is built into the image.
    environment:
      ABOUT_PORT: "80"
      RUN_AS: nettest
    command: ["node", "/opt/about/server.mjs"]

  mdns:
    <<: *nettest
    container_name: nettest-mdns
    # Answers to <MDNS_NAME>.local and advertises the About page and Cutie
    # as _http._tcp services. Only ONE mDNS responder may run per host:
    # disable the host's own avahi-daemon first (see README.md).
    user: root
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL]
    security_opt: ["no-new-privileges:true"]
    environment:
      MDNS_NAME: nettest          # advertised as nettest.local
      MDNS_INTERFACES: ""         # e.g. "eth0" to limit; empty = all
      MDNS_ABOUT_PORT: "80"       # empty = don't advertise
      MDNS_CUTIE_PORT: "4173"     # empty = don't advertise
    command: ["/opt/mdns/start.sh"]
